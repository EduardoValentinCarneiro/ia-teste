<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NEON CITY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         MENU
    ========================== -->

    <div id="menu">

        <div class="logo">
            NEON
            <span>CITY</span>
        </div>

        <p class="subtitle">
            OPEN WORLD
        </p>

        <button id="startGame">
            ENTRAR NA CIDADE
        </button>

        <button id="continueGame">
            CONTINUAR
        </button>

        <div class="controls">

            <p>
                <b>WASD</b> — movimentar
            </p>

            <p>
                <b>SHIFT</b> — correr
            </p>

            <p>
                <b>E</b> — entrar/sair do veículo
            </p>

            <p>
                <b>F</b> — missão
            </p>

            <p>
                <b>ESC</b> — pausa
            </p>

        </div>

    </div>


    <!-- =========================
         JOGO
    ========================== -->

    <canvas id="gameCanvas"></canvas>


    <!-- =========================
         HUD
    ========================== -->

    <div id="hud">

        <div class="hud-left">

            <div class="player-card">

                <div class="avatar">
                    N
                </div>

                <div>
                    <strong>PLAYER</strong>
                    <span id="playerName">
                        NEO
                    </span>
                </div>

            </div>

            <div class="money">
                $
                <span id="money">
                    2,500
                </span>
            </div>

        </div>


        <div class="hud-right">

            <div class="wanted">

                <span>PROCURADO</span>

                <div id="stars">
                    ☆ ☆ ☆ ☆ ☆
                </div>

            </div>

            <div class="clock">
                <span id="clock">
                    12:00
                </span>
            </div>

        </div>


        <!-- MISSÃO -->

        <div id="missionBox">

            <div class="mission-label">
                MISSÃO
            </div>

            <div id="missionTitle">
                Explore a cidade
            </div>

            <div id="missionDescription">
                Encontre seu primeiro veículo.
            </div>

        </div>


        <!-- VEÍCULO -->

        <div id="vehicleHUD">

            <div class="vehicle-name">
                VEÍCULO
            </div>

            <div class="speed">
                <span id="speed">
                    0
                </span>

                <small>KM/H</small>
            </div>

            <div class="fuel-container">

                <span>COMBUSTÍVEL</span>

                <div class="fuel-bar">
                    <div id="fuel"></div>
                </div>

            </div>

        </div>


        <!-- MINIMAPA -->

        <div id="minimap">

            <canvas id="mapCanvas"
                    width="180"
                    height="180">
            </canvas>

            <div class="map-player">
                ●
            </div>

        </div>


        <!-- NOTIFICAÇÕES -->

        <div id="notifications"></div>

    </div>


    <!-- =========================
         PAUSA
    ========================== -->

    <div id="pause">

        <div class="pause-box">

            <h1>PAUSADO</h1>

            <button id="resume">
                CONTINUAR
            </button>

            <button id="save">
                SALVAR JOGO
            </button>

            <button id="exit">
                MENU PRINCIPAL
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
